schema: spec-driven

context: |
  Tech stack: Next.js (App Router) + TypeScript + React, single app (Angular dropped per D1).
    N3.js for RDF. Vitest for unit/integration tests, Playwright for e2e. n8n workflow
    exported at n8n/faf-workflow.json (scheduler + raw fetch only, per D2).
  Architecture: 4-layer stream-oriented pipeline per docs/papers/Financial_Argumentation_Framework.pdf
    L1 src/rdf (RDF mapping) -> L2 src/stream (hand-built sliding-window engine over N3.js, per D-A) ->
    L3 src/laf (LAF label algebra) -> L4 src/decision (score + thresholds) -> src/cycle (pure L1-L4 composition).
    app/api/{cycle,decisions} routes, app/(dashboard) UI. See openspec/changes/faf-platform/design.md.
  Testing: Strict TDD Mode active (global user convention). Test runner: Vitest. Golden tests
    (tests/golden/{algebra-only,paper-example}.test.ts) reproduce the FAF paper's Section 3
    worked example exactly (BUY, sigma+=0.75, sigma-=0.475, gap=0.275) at 1e-9 tolerance.
  Style: TypeScript strict mode, no comments except non-obvious rationale (paper equation
    citations, deviation notes). See openspec/changes/faf-platform/design.md for conventions.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Flag any deviation from docs/PRD.md explicitly and require user sign-off
    - Cross-reference every architectural claim against docs/papers/Financial_Argumentation_Framework.pdf
      and docs/papers/An approach to characterize graded entailment of arguments through a label-based framework.pdf
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Formulas and thresholds (label algebra, score, θ, δ) must match the FAF paper exactly unless the proposal explicitly changes them
  design:
    - Include sequence diagrams for complex flows (stream ingestion, window evaluation, argument labeling, decision emission)
    - Document architecture decisions with rationale, especially fidelity-vs-pragmatism trade-offs (RSP-QL engine, L3 persistence)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
    tdd: true
    test_command: "npx vitest run"
  verify:
    test_command: "npx vitest run"
    build_command: "npx tsc --noEmit"
    e2e_command: "npx playwright test"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
